<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — ENVEA QAL2 Analyser</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>
</head><body>
<div class="card shadow-lg" style="width:360px;border-top:4px solid #E67E22;">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <h4 class="fw-bold"><span style="color:#E67E22">ENVEA</span> · QAL2 Analyser</h4>
      <p class="text-muted small">Accès réservé aux techniciens ENVEA</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Mot de passe d'accès</label>
        <input type="password" name="password" class="form-control" placeholder="•••••••�""autofocus>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-semibold">Se connecter</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
